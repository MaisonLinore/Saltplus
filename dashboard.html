<style>
    body, html {
        margin: 0; padding: 0; height: 100%; width: 100%;
        /* Menggunakan background.png sebagai latar belakang utama */
        background: url('background.png') no-repeat center center fixed;
        background-size: cover;
        font-family: 'Segoe UI', sans-serif;
        display: flex; justify-content: center; align-items: center;
        overflow: hidden;
    }

    /* Kotak login dibuat transparan (glassmorphism) agar gambar background terlihat */
    .login-container {
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(8px);
        border: 2px solid #00ffff;
        border-radius: 15px;
        padding: 40px;
        width: 300px;
        text-align: center;
        box-shadow: 0 0 25px rgba(0, 255, 255, 0.3);
    }

    h1 { color: #fff; margin: 0; font-size: 2rem; letter-spacing: 5px; }
    h2 { color: #00ffff; margin-bottom: 30px; font-size: 1rem; }

    input {
        width: 100%; padding: 12px; margin-bottom: 20px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid #00ffff; border-radius: 5px;
        color: #fff; text-align: center;
    }

    .btn-action {
        width: 100%; padding: 12px;
        background: #00ffff; color: #000;
        font-weight: bold; border: none; border-radius: 5px;
        cursor: pointer; text-transform: uppercase;
    }
</style>

<body>
    <div class="login-container">
        <h1>SÀLT+</h1>
        <h2>AETERNA OS</h2>
        <!-- Input untuk Email -->
        <input type="email" placeholder="ENTER EMAIL">
        <!-- Input untuk Token -->
        <input type="text" placeholder="ENTER TOKEN">
        <button class="btn-action">INITIALIZE</button>
    </div>
</body>
