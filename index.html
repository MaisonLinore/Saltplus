<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SALT+ AETERNA OS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Ganti URL gambar di bawah dengan gambar background milikmu */
            background-image: url('https://source.unsplash.com/random/1080x1920?dark,tech');
            background-size: cover;          /* Memastikan gambar menutupi seluruh layar */
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;    /* Efek parallax sederhana */
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: brightness(0.7); /* Menggelapkan background agar teks lebih terbaca */
        }

        /* Overlay opsional untuk meningkatkan keterbacaan teks (bisa dihapus jika tidak perlu) */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }

        .wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;   /* Ukuran ideal seperti layar HP */
            padding: 24px 20px;
            background: rgba(0, 0, 0, 0.6);  /* Kardus transparan gelap */
            border-radius: 32px;
            backdrop-filter: blur(8px);
            text-align: center;
            box-shadow: 0 25px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Gaya untuk poster/image tambahan jika ada di dalam konten */
        .poster-img {
            width: 100%;
            max-width: 280px;
            border-radius: 24px;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.3);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .sub {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .description {
            font-size: 0.85rem;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .btn {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.4);
            padding: 12px 24px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            text-decoration: none;
            transition: 0.2s;
            display: inline-block;
        }

        .btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.02);
        }

        footer {
            margin-top: 32px;
            font-size: 0.7rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

        <!-- Kamu bisa ganti poster-img dengan gambar lain, atau hapus jika tidak perlu -->
        <img class="poster-img" src="https://via.placeholder.com/300x400?text=SALT+AETERNA+OS" alt="Poster SALT+ AETERNA OS" 
             onerror="this.src='https://placehold.co/300x400/1a1a2e/white?text=SALT+OS'">

            <br>Siap untuk evolusi digital Anda.
        </div>
        <a href="#" class="btn">Jelajahi Sekarang →</a>
        <footer>© 2026 SALT+ AETERNA — Immortal System</footer>
    </div>
</body>
