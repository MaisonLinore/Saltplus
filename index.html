<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>SALT+ AETERNA OS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Ganti dengan gambar Anda */
            background-image: url('Screenshot_2026-05-14-19-17-08-312_com.miui.gallery.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: system-ui, 'Segoe UI', 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            /* Dark overlay untuk keterbacaan teks */
            position: relative;
        }

        /* Overlay gelap transparan */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: 0;
        }

        /* Konten teks di atas gambar */
        .hero {
            position: relative;
            z-index: 2;
            max-width: 380px;
            width: 90%;
            padding: 32px 24px;
            background: rgba(10, 10, 20, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4);
            animation: fadeUp 0.6s ease;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #ffb347, #ff6b6b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .badge {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: #ffd966;
            text-transform: uppercase;
            background: rgba(0,0,0,0.4);
            display: inline-block;
            padding: 4px 14px;
            border-radius: 40px;
            margin-bottom: 12px;
        }

        .sub {
            font-size: 1.1rem;
            font-weight: 500;
            color: #f0eef7;
            margin: 12px 0 8px;
            border-left: 3px solid #ffb347;
            display: inline-block;
            padding-left: 12px;
        }

        .desc {
            font-size: 0.9rem;
            line-height: 1.45;
            color: #f5f0ff;
            margin: 16px 0;
            opacity: 0.95;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(95deg, #ff8c42, #ff3b6f);
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 0.9rem;
            color: white;
            text-decoration: none;
            margin: 8px 0 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: scale(1.02);
        }

        footer {
            font-size: 0.7rem;
            color: #ccc;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 16px;
            margin-top: 8px;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="badge">✦ SALT OS ✦</div>
        <h1>SALT+ AETERNA OS</h1>
        <div class="sub">Next-Gen Interface</div>
        <div class="desc">
            Eternal new experience. Stability, speed, and future design.<br>
            Ready for your digital evolution.
        </div>
        <a href="#" class="btn">Explore Now →</a>
        <footer>© 2026 SALT+ AETERNA — Immortal System</footer>
    </div>
</body>
</html>
