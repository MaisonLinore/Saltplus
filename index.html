


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>SALT+ AETERNA OS | Gate to SALT+ VS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0718;
            font-family: 'Segoe UI', system-ui, 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Smartphone container */
        .phone {
            max-width: 400px;
            width: 100%;
            background: rgba(20, 15, 40, 0.6);
            backdrop-filter: blur(2px);
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 30px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.1);
        }

        /* Dua kolom: kiri gambar, kanan dashboard */
        .dual {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }

        /* Sisi kiri: gambar cewek dalam HP */
        .left-girl {
            flex: 1;
            min-width: 140px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 8px 12px 12px;
        }

        .left-girl img {
            width: 100%;
            height: auto;
            border-radius: 28px;
            object-fit: cover;
            box-shadow: 0 12px 28px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,200,100,0.5);
        }

        /* Sisi kanan: dashboard SALT+ AETERNA OS (gate) */
        .right-dashboard {
            flex: 1.2;
            padding: 24px 18px 24px 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: linear-gradient(135deg, rgba(25, 20, 45, 0.8), rgba(15, 10, 30, 0.9));
            backdrop-filter: blur(8px);
        }

        .title {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffb347, #ff6b6b, #fff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .feature-list {
            list-style: none;
            margin: 8px 0;
        }

        .feature-list li {
            font-size: 0.75rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #e2daff;
            font-weight: 500;
        }

        .feature-list li::before {
            content: "⚡";
            color: #ffb347;
            font-size: 0.8rem;
        }

        .init {
            font-family: monospace;
            background: rgba(0,0,0,0.5);
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            letter-spacing: 1px;
            color: #aaffdd;
            border: 1px solid #aaffdd80;
            display: inline-block;
            width: fit-content;
        }

        .btn-gate {
            background: linear-gradient(95deg, #ff8c42, #ff3b6f);
            border: none;
            padding: 10px 18px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 0.85rem;
            color: white;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            width: fit-content;
            margin: 8px 0 4px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.3);
            transition: 0.2s;
        }

        .btn-gate:hover {
            transform: scale(1.02);
            background: linear-gradient(95deg, #ff9f5a, #ff5a85);
        }

        footer {
            font-size: 0.6rem;
            color: #aaa;
            border-top: 1px solid rgba(255,255,255,0.15);
            padding-top: 12px;
            margin-top: 8px;
            text-align: center;
        }

        /* Responsive: jika layar terlalu kecil, kolom jadi stack */
        @media (max-width: 480px) {
            .dual {
                flex-direction: column;
            }
            .left-girl {
                padding: 20px 20px 0 20px;
            }
            .left-girl img {
                max-width: 180px;
                margin: 0 auto;
            }
            .right-dashboard {
                padding: 24px 20px;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .left-girl, .right-dashboard {
            animation: fadeIn 0.5s ease forwards;
        }
    </style>
</head>
<body>
    <div class="phone">
        <div class="dual">
            <!-- KIRI: gambar cewek dalam HP (ganti dengan file gambar kamu) -->
            <div class="left-girl">
                <img src="Screenshot_2026-05-14-19-17-08-312_com.miui.gallery.jpg" 
                     alt="Girl in phone" 
                     onerror="this.src='https://placehold.co/300x400/2c1a4e/ffb347?text=GIRL+IMAGE'">
            </div>

            <!-- KANAN: DASHBOARD SALT+ AETERNA OS sebagai gate ke SALT+ VS -->
            <div class="right-dashboard">
                <div class="title">SALT+ AETERNA OS</div>
                <ul class="feature-list">
                    <li>Zero Lag Intelligence</li>
                    <li>Quantum UI Fluid</li>
                    <li>Eternal Security Core</li>
                </ul>
                <div class="init">▶ INITIALIZE SYSTEM</div>
                <!-- Tombol gate menuju Salt+ VS -->
                <a href="#" class="btn-gate" id="gateToVS">Start to Salt+ →</a>
                <footer>© 2026 SALT+ AETERNA – Immortal Experience | Smartphone Edition</footer>
            </div>
        </div>
    </div>

    <script>
        // Optional: ketika tombol diklik, redirect ke halaman Salt+ VS (ganti link sesuai kebutuhan)
        document.getElementById('gateToVS').addEventListener('click', function(e) {
            e.preventDefault();
            // Ganti 'https://aeternaemplus.com/salt/index.html' dengan URL tujuan Salt+ VS
            window.location.href = 'https://aeternaemplus.com/salt/index.html';
        });
    </script>
</body>
</html>
