<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SÀLT+ AETERNA OS</title>
    <style>
       
        (IMG_20260513_222546.jpg)

        body { 
            background: #000; 
            color: #fff; 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }
        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 320px;
        }
        
        /* Gaya Poster Baru: Tanpa Kotas/Kanvas, Langsung Menempel Bersih */
        .poster-img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            margin-bottom: 25px;
            display: block;
        }
        
        .gate-container { 
            border: 1px solid rgba(0,243,255,0.5); 
            border-radius: 20px; 
            padding: 35px 20px; 
            text-align: center; 
            background: #000; 
            width: 100%; 
            box-shadow: 0 0 20px rgba(0,243,255,0.4); 
            box-sizing: border-box;
        }
        .brand-top { 
            color: #fff; 
            font-size: 2.2rem; 
            letter-spacing: 12px; 
            margin-bottom: 5px; 
            font-weight: bold; 
            text-shadow: 0 0 15px rgba(255,255,255,0.6); 
        }
        h1 { 
            color: #00f3ff; 
            font-size: 1.8rem; 
            text-shadow: 0 0 10px #00f3ff; 
            margin: 0 0 25px 0; 
            font-weight: bold; 
            line-height: 1.1; 
        }
        .input-key { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 15px; 
            background: #111; 
            border: 1px solid #333; 
            border-radius: 10px; 
            color: #fff; 
            text-align: center; 
            outline: none; 
            font-size: 1.1rem; 
            letter-spacing: 4px; 
            box-sizing: border-box;
        }
        .btn-init { 
            width: 100%; 
            padding: 14px; 
            background: #00f3ff; 
            border: none; 
            border-radius: 10px; 
            color: #000; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase; 
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Poster Tanpa Kotas Frame -->
        <img src="ibb.co" alt="AETERNA OS" class="poster-img" onerror="this.style.display='none'">

        <!-- Form Login Utama -->
        <div class="gate-container">
            <div class="brand-top">SÀLT+</div>
            <h1>AETERNA<br>OS</h1>
            <input type="text" id="pincode" class="input-key" placeholder="8-DIGIT PIN" maxlength="8">
            <button class="btn-init" onclick="openEco()">INITIALIZE</button>
        </div>
    </div>

    <script>
        function openEco() {
            var pin = document.getElementById('pincode').value.trim();
            
            // Validasi kecocokan PIN
            if(pin === 'free7d' || pin.length === 8) {
                // Alur Baru: Begitu sukses, langsung dilempar ke halaman Salt+ VS
                window.location.href = "https://aeternaemplus.com/salt/index.html";
            } else { 
                alert('Access Denied: Invalid Token'); 
            }
        }
    </script>
</body>
